name: Daily Wrigley Summary

on:
  workflow_dispatch:

  schedule:
    - cron: "5 0 * * *"
      timezone: "America/Chicago"

permissions:
  contents: read
  issues: write

jobs:
  generate-summary:
    runs-on: ubuntu-latest

    env:
      TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.9"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Ticketmaster secret
        run: |
          if [ -z "$TICKETMASTER_API_KEY" ]; then
            echo "TICKETMASTER_API_KEY is not configured."
            exit 1
          fi

      - name: Run Wrigley Events Bot
        run: python app.py

      - name: Create issue body
        run: |
          REPORT_DATE="$(TZ=America/Chicago date '+%A, %B %-d, %Y')"
          UPDATED_TIME="$(TZ=America/Chicago date '+%-I:%M %p %Z')"

          {
            echo "# 🏟️ Wrigley Today"
            echo
            echo "**${REPORT_DATE}**"
            echo
            cat output/daily_summary.txt
            echo
            echo
            echo "_Last updated automatically at ${UPDATED_TIME}_"
          } > issue-body.md

            - name: Update persistent issue
        env:
          ISSUE_NUMBER: "12"
        run: |
          ISSUE_TITLE="🏟️ Wrigley Today"

          echo "Updating issue #${ISSUE_NUMBER}"
          echo
          echo "Generated issue body:"
          cat issue-body.md

          gh issue edit "$ISSUE_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$ISSUE_TITLE" \
            --body-file issue-body.md

          echo
          echo "Issue body after update:"

          gh issue view "$ISSUE_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --json body \
            --jq '.body'

      - name: Upload generated summary
        uses: actions/upload-artifact@v7
        with:
          name: wrigley-daily-summary
          path: |
            output/daily_summary.txt
            output/wrigley_events.json
          if-no-files-found: error
          retention-days: 7