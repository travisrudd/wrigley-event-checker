name: Daily Wrigley Summary

on:
  workflow_dispatch:

  schedule:
    - cron: "5 0 * * *"
      timezone: "America/Chicago"

permissions:
  contents: read
  issues: write

jobs:
  generate-summary:
    runs-on: ubuntu-latest

    env:
      TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.9"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Ticketmaster secret
        run: |
          if [ -z "$TICKETMASTER_API_KEY" ]; then
            echo "TICKETMASTER_API_KEY is not configured."
            exit 1
          fi

      - name: Run Wrigley Events Bot
        run: python app.py

      - name: Create issue body
        run: |
          REPORT_DATE="$(TZ=America/Chicago date '+%A, %B %-d, %Y')"
          UPDATED_TIME="$(TZ=America/Chicago date '+%-I:%M %p %Z')"

          {
            echo "# 🏟️ Wrigley Today"
            echo
            echo "**${REPORT_DATE}**"
            echo
            cat output/daily_summary.txt
            echo
            echo
            echo "_Last updated automatically at ${UPDATED_TIME}_"
          } > issue-body.md

      - name: Create or update persistent issue
        env:
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          ISSUE_TITLE="🏟️ Wrigley Today"

          ISSUE_NUMBER="$(
            gh issue list \
              --repo "$GITHUB_REPOSITORY" \
              --state all \
              --limit 100 \
              --json number,title \
              --jq '.[] | select(.title == "🏟️ Wrigley Today") | .number' \
              | head -n 1
          )"

          REPORT_DATE="$(TZ=America/Chicago date '+%B %-d, %Y')"

          if [ -n "$ISSUE_NUMBER" ]; then
            gh issue reopen "$ISSUE_NUMBER" \
              --repo "$GITHUB_REPOSITORY" 2>/dev/null || true

            gh issue edit "$ISSUE_NUMBER" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$ISSUE_TITLE" \
              --body-file issue-body.md \
              --add-assignee "$REPOSITORY_OWNER"

            gh issue comment "$ISSUE_NUMBER" \
              --repo "$GITHUB_REPOSITORY" \
              --body "🔔 Updated for **${REPORT_DATE}**."
          else
            ISSUE_URL="$(
              gh issue create \
                --repo "$GITHUB_REPOSITORY" \
                --title "$ISSUE_TITLE" \
                --body-file issue-body.md \
                --assignee "$REPOSITORY_OWNER"
            )"

            ISSUE_NUMBER="${ISSUE_URL##*/}"

            gh issue pin "$ISSUE_NUMBER" \
              --repo "$GITHUB_REPOSITORY"
          fi

      - name: Upload generated summary
        uses: actions/upload-artifact@v7
        with:
          name: wrigley-daily-summary
          path: |
            output/daily_summary.txt
            output/wrigley_events.json
          if-no-files-found: error
          retention-days: 7