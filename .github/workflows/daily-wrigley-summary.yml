name: Daily Wrigley Summary

on:
  workflow_dispatch:

  schedule:
    - cron: "5 8 * * *"
      timezone: "America/Chicago"

permissions:
  contents: read
  issues: write

jobs:
  generate-summary:
    runs-on: ubuntu-latest

    env:
      TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.9"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Ticketmaster secret
        run: |
          if [ -z "$TICKETMASTER_API_KEY" ]; then
            echo "TICKETMASTER_API_KEY is not configured."
            exit 1
          fi

      - name: Run Wrigley Events Bot
        run: python app.py

      - name: Create GitHub notification
        env:
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          REPORT_DATE="$(TZ=America/Chicago date '+%B %-d, %Y')"
          ISSUE_TITLE="🏟️ Wrigley Events — ${REPORT_DATE}"

          {
            echo "@${REPOSITORY_OWNER}"
            echo
            cat output/daily_summary.txt
            echo
            echo "---"
            echo
            echo "_Generated automatically by the Wrigley Events Bot._"
          } > issue-body.md

          gh issue create \
            --repo "$GITHUB_REPOSITORY" \
            --title "$ISSUE_TITLE" \
            --body-file issue-body.md \
            --assignee "$REPOSITORY_OWNER"

      - name: Upload generated summary
        uses: actions/upload-artifact@v7
        with:
          name: wrigley-daily-summary
          path: |
            output/daily_summary.txt
            output/wrigley_events.json
          if-no-files-found: error
          retention-days: 7